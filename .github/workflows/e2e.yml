name: E2E Tests

on:
  push:
    branches: ["**"]
    branches-ignore: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Least privilege by default. Nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # chromium for Desktop Chrome / mobile-chrome, webkit for mobile-safari.
      # Installing only chromium leaves the whole mobile-safari project failing
      # to launch, which looks like an application failure.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # The suite drives a dev server, not a production build. Playwright owns the
      # server through playwright.config.ts `webServer`, so this workflow must NOT
      # start one itself: doing so raced two servers for port 3000 and left
      # readiness as a `sleep`.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
